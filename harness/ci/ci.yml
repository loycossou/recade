name: CI

on:
  # Pull requests only: a merge into main has already passed the same checks. A run can also be started by hand.
  pull_request:
  workflow_dispatch:

# Read only. No job writes to the repository, no job needs a token, and no step reads a secret.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each action is pinned to a full commit, with its release in a comment. The Dependabot file next to this one keeps them current.
jobs:
  # A new repository holds no code until its first change adds some. Until then there is nothing to install, lint,
  # build or test, so the jobs below are skipped (GitHub reports a skipped job as passing) and the run summary says why.
  # They run from the first file of code.
  code:
    name: Code present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.look.outputs.present }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Look for code
        id: look
        run: |
          set -euo pipefail
          first="$(git ls-files | grep -Ev '^(\.claude/|\.githooks/|\.github/|CLAUDE\.md$|AGENTS\.md$|README[^/]*$|LICENSE[^/]*$|\.gitignore$|\.gitattributes$|\.editorconfig$|tests/quarantine\.json$)' | head -n 1 || true)"
          if [ -n "$first" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No code yet, so the lint, build, test and security jobs are skipped. They run from the first file of code." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  quality:
    name: Lint, types, unit and contract tests
    needs: code
    if: needs.code.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # __RECADE_SETUP__
      - name: Install dependencies
        run: |
          __RECADE_INSTALL__
      - name: Lint
        run: |
          __RECADE_LINT__
      - name: Typecheck
        run: |
          __RECADE_TYPECHECK__
      - name: Build
        run: |
          __RECADE_BUILD__
      - name: Unit tests
        run: |
          __RECADE_TEST__
      - name: Contract tests
        run: |
          __RECADE_CONTRACT__

  e2e:
    name: End to end, confirmations, accessibility, performance
    needs: code
    if: needs.code.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # __RECADE_SETUP__
      - name: Install dependencies
        run: |
          __RECADE_INSTALL__
      - name: Install the browsers
        run: |
          __RECADE_E2E_SETUP__
      - name: End to end tests (Playwright)
        run: |
          __RECADE_E2E__
      # One test per sensitive action, tagged @confirmation: it proves the dialog, the distant confirm button and the undo.
      - name: Confirmation tests
        run: |
          __RECADE_CONFIRMATION__
      # Accessibility with axe, on the pages and the dialogs, WCAG 2.2 AA.
      - name: Accessibility tests (axe)
        run: |
          __RECADE_ACCESSIBILITY__
      # The performance budgets (response time, page weight, Core Web Vitals). A budget is never raised to make a run pass.
      - name: Performance budget
        run: |
          __RECADE_PERFORMANCE__
      - name: Keep the Playwright reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: SAST, dependency audit, SBOM, secrets
    needs: code
    if: needs.code.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # __RECADE_SETUP__
      - name: Install dependencies
        run: |
          __RECADE_INSTALL__
      - name: Static analysis (SAST)
        run: |
          __RECADE_SAST__
      - name: Dependency audit
        run: |
          __RECADE_AUDIT__
      # The command writes the bill of materials into sbom/.
      - name: Software bill of materials (SBOM)
        run: |
          __RECADE_SBOM__
      # Skipped when the project has no SBOM: there is then nothing to keep.
      - name: Keep the SBOM
        if: __RECADE_SBOM_UPLOAD__
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 30
      - name: Secret scan
        run: |
          __RECADE_SECRETS__
