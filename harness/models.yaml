# Single source for the model and effort of every harness agent (spec 10.2).
# `recade harness models` copies these values into the front matter of harness/agents/*.md.
# Rules: floor Sonnet medium (test-runner is low), no xhigh or max, and the
# second-opinion model from another family than the reviewer, unless `second_opinion.same_family` says `warn`.
# ui-designer: raise it to opus for the art direction phase in the project copy of this file.
# The owner's choice between Fable and Opus (`models.writer`, `recade models writer`) covers the plugin's writing
# agents, not this table. In this table no agent runs on Fable: the second-opinion runs on Opus 5.5, the same family
# as the reviewer. `second_opinion.same_family: warn` allows it, and `recade harness models` and `recade harness verify`
# print a warning instead of refusing. The second opinion keeps its other independence: it reads the PR, the sheet and
# the requirements, never the reports of the other agents. The owner chooses it in /recade:start
# (`models.second_opinion` of the user config): `opus` keeps this table, `fable` puts the project copy of the agent on
# claude-fable-5-2, another family, at `recade harness install` and `recade harness models --dir .claude/agents`.
agents:
  spec-writer:
    standard: { model: opus, effort: high }
    sensitive: { model: opus, effort: high }
  ux-designer:
    standard: { model: opus, effort: high }
    sensitive: { model: opus, effort: high }
  ui-designer:
    standard: { model: sonnet, effort: high }
    sensitive: { model: sonnet, effort: high }
  test-engineer:
    standard: { model: sonnet, effort: high }
    sensitive: { model: sonnet, effort: high }
  implementer:
    standard: { model: sonnet, effort: high }
    sensitive: { model: sonnet, effort: high }
  implementer-critical:
    standard: { model: opus, effort: high }
    sensitive: { model: opus, effort: high }
  reviewer:
    standard: { model: opus, effort: high }
    sensitive: { model: opus, effort: high }
  security-reviewer:
    standard: { model: sonnet, effort: high }
    sensitive: { model: opus, effort: high }
  design-reviewer:
    standard: { model: sonnet, effort: high }
    sensitive: { model: sonnet, effort: high }
  product-reviewer:
    standard: { model: opus, effort: medium }
    sensitive: { model: opus, effort: medium }
  domain-reviewer:
    standard: { model: sonnet, effort: high }
    sensitive: { model: sonnet, effort: high }
  devops:
    standard: { model: sonnet, effort: medium }
    sensitive: { model: sonnet, effort: medium }
  doc-writer:
    standard: { model: sonnet, effort: medium }
    sensitive: { model: sonnet, effort: medium }
  release-manager:
    standard: { model: sonnet, effort: medium }
    sensitive: { model: sonnet, effort: medium }
  board-keeper:
    standard: { model: sonnet, effort: medium }
    sensitive: { model: sonnet, effort: medium }
  explorer:
    standard: { model: sonnet, effort: medium }
    sensitive: { model: sonnet, effort: medium }
  test-runner:
    standard: { model: sonnet, effort: low }
    sensitive: { model: sonnet, effort: low }
  code-teacher:
    standard: { model: sonnet, effort: high }
    sensitive: { model: sonnet, effort: high }
  second-opinion:
    standard: { model: claude-opus-5-5, effort: high }
    sensitive: { model: claude-opus-5-5, effort: high }
  merge-keeper:
    standard: { model: sonnet, effort: medium }
    sensitive: { model: sonnet, effort: medium }
# What a second-opinion in the reviewer's family gives: `error` (the default when the key is missing) or `warn`.
second_opinion:
  same_family: warn
# Which family each model id or alias belongs to. Used to check the second-opinion rule.
families:
  opus: [opus, claude-opus-5-5]
  sonnet: [sonnet]
  fable: [claude-fable-5-2]
