# Dependency updates arrive as ordinary pull requests, so they pass the same CI and the same review as any other
# change. Nothing here merges anything.
version: 2
updates:
  - package-ecosystem: __RECADE_ECOSYSTEM__
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new version waits a few days before its pull request: a release pulled back by its author never arrives.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the actions of .github/workflows up to date: the pinned commit and its release comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new version waits a few days before its pull request: a release pulled back by its author never arrives.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
